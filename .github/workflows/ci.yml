name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: uv run ruff check .

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        extras: ["--extra dev --extra documents --extra labeling", "--extra dev"]
    runs-on: ${{ matrix.os }}
    env:
      HF_HUB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: OpenMP runtime for LightGBM (macOS)
        if: runner.os == 'macOS'
        run: brew install libomp
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync ${{ matrix.extras }}
      - name: tests (offline, CPU only)
        run: uv run pytest -q
