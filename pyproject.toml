[project]
name = "open-rlcd"
version = "0.1.0"
description = "Open RLCD: a small, domain-agnostic decision model toolkit. Typed questions answered with calibrated probabilities, measured on data the model never saw; a router / gatekeeper / evaluator in front of (and behind) an LLM."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
authors = [{ name = "f8fvwgzc" }]
keywords = ["calibration", "decision-model", "rag", "router", "llm-evaluator", "lightgbm", "conformal"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Core: small and CPU-only. No torch, no network access at import time.
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "safetensors>=0.4",
]

[project.optional-dependencies]
# the enterprise-documents pack: frozen ONNX encoder, local ANN index, local graph, PDF text
documents = [
    "onnxruntime>=1.18",
    "tokenizers>=0.19",
    "huggingface-hub>=0.23",
    "networkx>=3.2",
    "faiss-cpu>=1.8",
    "pypdf>=4.0",
]
qdrant = ["qdrant-client>=1.9"]
pgvector = ["psycopg[binary]>=3.1", "pgvector>=0.2"]
neo4j = ["neo4j>=5.20"]
labeling = ["anthropic>=0.40"]
parquet = ["pyarrow>=15"]
# optional, later: LoRA fine-tune of a small cross-encoder for chunk_relevant (20k+ labelled pairs)
finetune = ["torch>=2.3", "transformers>=4.44", "peft>=0.12", "onnx>=1.16"]
dev = ["pytest>=8", "pytest-timeout>=2.3", "ruff>=0.6"]

[project.scripts]
rlcd = "open_rlcd.cli:main"

[project.urls]
Homepage = "https://github.com/f8fvwgzc/open-rlcd"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["open_rlcd"]

[tool.hatch.build.targets.wheel.force-include]
"bundles/demo-documents" = "open_rlcd/_demo/demo-documents"

[tool.hatch.build.targets.sdist]
exclude = ["START_HERE_PROMPT.md", "var", ".venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
timeout = 600
markers = [
    "network: needs network access (skipped unless RLCD_TEST_NETWORK=1)",
    "slow: takes more than a few seconds",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
